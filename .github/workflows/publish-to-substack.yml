name: Publish to Substack

on:
  push:
    paths:
      - 'posts/*.md'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get new or modified post file
        id: post
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD -- 'posts/*.md' | head -1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          if [ -z "$FILE" ]; then echo "No post file changed"; exit 0; fi

          TITLE=$(head -1 "$FILE" | sed 's/^#\s*//')
          BODY=$(tail -n +3 "$FILE")

          echo "title=$TITLE" >> $GITHUB_OUTPUT
          {
            echo 'body<<BODYEOF'
            echo "$BODY"
            echo 'BODYEOF'
          } >> $GITHUB_OUTPUT

      - name: Send to Substack via email
        if: steps.post.outputs.file != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: jaymoody0812@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.post.outputs.title }}
          to: ${{ secrets.SUBSTACK_EMAIL }}
          from: Jacob Moody <jaymoody0812@gmail.com>
          body: ${{ steps.post.outputs.body }}
          convert_markdown: false
